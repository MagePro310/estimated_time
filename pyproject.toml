[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qcirc-time-estimator"
version = "0.1.0"
description = "Experimental framework to estimate quantum circuit execution time on IBM FakeBelem vs exact Qiskit duration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "qiskit>=1.0.0",
    "qiskit-ibm-runtime>=0.40.0",
    "mqt.bench>=2.2.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
qcirc-estimator = "qcirc_time_estimator.main:main"

[tool.setuptools.packages.find]
where = ["src"]

